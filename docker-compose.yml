services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grisk}
      POSTGRES_USER: ${POSTGRES_USER:-grisk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grisk}
    ports:
      - "5432:5432"
    volumes:
      - grisk_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grisk} -d ${POSTGRES_DB:-grisk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - grisk_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      GRISK_DATABASE_URL: ${GRISK_DATABASE_URL:-postgresql+asyncpg://grisk:grisk@postgres:5432/grisk}
      GRISK_REDIS_URL: ${GRISK_REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  grisk_postgres:
  grisk_redis:
